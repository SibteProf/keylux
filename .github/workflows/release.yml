name: Release

# Build distributable desktop packages. Runs on a version tag (attaches archives
# to a draft GitHub Release) and on manual dispatch (uploads them as workflow
# artifacts you can download from the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_name: keylux-windows-x64
            archive: keylux-windows-x64.zip
          - os: ubuntu-latest
            package_name: keylux-linux-x64
            archive: keylux-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxdo-dev libusb-1.0-0-dev pkg-config

      - name: Build release
        run: cargo build --release -p aula-app

      - name: Smoke test release binary
        run: |
          ./target/release/keylux --version
          ./target/release/keylux list

      - name: Test OpenRGB through the release binary
        env:
          KEYLUX_TEST_BINARY: ${{ github.workspace }}/target/release/keylux
        run: cargo test -p aula-app --test openrgb_cli

      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "${{ matrix.package_name }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/keylux.exe $stage/
          # The app loads effects from a folder next to the exe. The animations
          # folder is runtime content (gitignored), so ship an empty one with a
          # placeholder; the app also creates it on first run.
          Copy-Item -Recurse effects $stage/effects
          Copy-Item -Recurse docs $stage/docs
          New-Item -ItemType Directory -Force $stage/animations | Out-Null
          Set-Content $stage/animations/.gitkeep ""
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.archive }}" -Force

      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage="${{ matrix.package_name }}"
          mkdir -p "$stage/animations"
          cp target/release/keylux "$stage/"
          cp -r effects "$stage/effects"
          cp -r docs "$stage/docs"
          touch "$stage/animations/.gitkeep"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "${{ matrix.archive }}" -C "$stage" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: ${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          draft: true
