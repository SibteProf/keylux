name: Release

# Build a distributable Windows executable. Runs on a version tag (attaches the
# zip to a GitHub Release) and on manual dispatch (uploads it as an artifact you
# can download from the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p aula-app

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "keylux-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/keylux.exe $stage/
          # The app loads effects and animations from folders next to the exe.
          Copy-Item -Recurse effects $stage/effects
          Copy-Item -Recurse animations $stage/animations
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath keylux-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylux-windows-x64
          path: keylux-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: keylux-windows-x64.zip
