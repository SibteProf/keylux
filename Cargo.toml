[workspace]
resolver = "2"
members = [
    "crates/aula-protocol",
    "crates/aula-effects",
    "crates/aula-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SibteHussain/aula-rgb"
authors = ["Sibte Hussain"]

[workspace.dependencies]
aula-protocol = { path = "crates/aula-protocol" }
aula-effects = { path = "crates/aula-effects" }

anyhow = "1"
thiserror = "2"
hidapi = "2"
rhai = { version = "1", features = ["sync"] }
notify = "7"
# default-features = false drops the "links" feature, which pulls in
# webbrowser -> url -> idna -> icu -> displaydoc. We never open hyperlinks, and
# that chain fails to build on some toolchains.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "bmp", "webp", "tga"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
